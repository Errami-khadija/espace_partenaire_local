<section class="kpi-grid">
  <article class="kpi-card" *ngFor="let item of stats; let i = index">
    <p class="kpi-label">{{ item.label }}</p>
    <h3 #animatedValue class="kpi-value">0</h3>
    <p class="kpi-delta" [class.positive]="item.tone === 'positive'">{{ item.delta }}</p>
  </article>
</section>
